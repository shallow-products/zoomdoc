name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome Lint Check
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Build Distribution
        run: npm run build

      - name: Check that dist is up to date
        run: |
          if ! git diff --exit-code --stat dist; then
            echo "::error::dist/ がソースと食い違っています。npm run build を実行し、差分をコミットしてください。"
            exit 1
          fi

      - name: Document consistency (zoomdoc:lint)
        run: npm run lint:doc

      - name: Run Tests (Vitest Unit & Integration)
        run: npm run test:unit

      - name: Test Plugin Hooks with CLAUDE_PLUGIN_ROOT
        run: |
          export CLAUDE_PLUGIN_ROOT="$PWD"
          node "$CLAUDE_PLUGIN_ROOT/scripts/hooks/run.js" --env=claude --force

      - name: Smoke test in a clean project
        run: sh scripts/ci_smoke.sh

  compat:
    name: Node 18 compatibility (hooks and bundled scripts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 18
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18

      - name: Smoke test with Node 18 (no npm install)
        run: sh scripts/ci_smoke.sh
